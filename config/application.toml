#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[micronaut.application]
name = 'pixel-studio'

[micronaut.router.static-resources.swagger]
paths = 'classpath:META-INF/swagger'
mapping = '/swagger/**'

[micronaut.router.static-resources.swagger-ui]
paths = 'classpath:META-INF/swagger/views/swagger-ui'
mapping = '/swagger-ui/**'

# Relais de l'appareil Bluetooth par défaut (créé tant que devices.json n'existe pas) et délais
[pixel-studio.bridge]
host = '127.0.0.1'
port = 7777
connect-timeout-ms = 2000
reply-timeout-ms = 2000

[micronaut.router.static-resources.default]
paths = 'classpath:public'
mapping = '/**'

# Application locale : pas de cache navigateur sur l'interface (60 s par défaut)
[micronaut.server.netty.responses.file]
cache-seconds = 0
